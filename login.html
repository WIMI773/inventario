<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f5f4f0;
      --surface:      #ffffff;
      --border:       #e8e6e0;
      --text:         #1a1915;
      --text2:        #6b6860;
      --text3:        #9e9b94;
      --accent:       #1a4fd6;
      --accent-hover: #1540b8;
      --green:        #1a8f4b;
      --green-bg:     #eaf6ef;
      --red:          #c0392b;
      --red-bg:       #fdecea;
      --radius-sm:    6px;
      --font:         'DM Sans', sans-serif;
      --tr:           0.15s ease;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-size: 14px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(26,79,214,.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(26,143,75,.05) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 32px rgba(0,0,0,.09);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      animation: slideUp .3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-header {
      padding: 32px 32px 24px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    .brand-logo {
      width: 48px; height: 48px;
      background: var(--accent); color: #fff;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 14px;
      box-shadow: 0 4px 12px rgba(26,79,214,.3);
    }

    .login-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .login-sub   { font-size: 13px; color: var(--text3); }
    .login-body  { padding: 28px 32px; }

    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }

    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 12px; color: var(--text3); pointer-events: none; display: flex; }

    .form-input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 14px;
      background: var(--surface); color: var(--text);
      outline: none;
      transition: border var(--tr), box-shadow var(--tr);
    }
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,79,214,.08);
    }

    .pass-toggle {
      position: absolute; right: 10px;
      background: none; border: none; color: var(--text3);
      cursor: pointer; padding: 4px; border-radius: 4px;
      display: flex; align-items: center; transition: color var(--tr);
    }
    .pass-toggle:hover { color: var(--text2); }

    .forgot-link {
      display: block; text-align: right; font-size: 12px;
      color: var(--accent); text-decoration: none; margin-top: 6px; cursor: pointer;
      transition: color var(--tr);
    }
    .forgot-link:hover { color: var(--accent-hover); text-decoration: underline; }

    .btn-login {
      width: 100%; padding: 11px 16px;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 14px; font-weight: 500;
      cursor: pointer; transition: background var(--tr), transform .1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 6px;
    }
    .btn-login:hover:not(:disabled)  { background: var(--accent-hover); }
    .btn-login:active:not(:disabled) { transform: scale(.99); }
    .btn-login:disabled              { opacity: .6; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner  { display: block; }
    .btn-login.loading .btn-text { display: none; }

    .msg-box {
      display: none; align-items: flex-start; gap: 8px;
      padding: 10px 13px; border-radius: var(--radius-sm);
      font-size: 12.5px; line-height: 1.5; margin-bottom: 14px;
    }
    .msg-box.error   { display: flex; background: var(--red-bg);   color: var(--red);   border: 1px solid #f5c6c2; }
    .msg-box.success { display: flex; background: var(--green-bg); color: var(--green); border: 1px solid #b7e4cb; }
    .msg-box svg { flex-shrink: 0; margin-top: 1px; }

    .login-footer {
      padding: 16px 32px 20px; text-align: center;
      font-size: 12px; color: var(--text3);
      border-top: 1px solid var(--border);
    }

    #panel-recover { display: none; }

    .back-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; color: var(--text2);
      cursor: pointer; background: none; border: none;
      font-family: var(--font); padding: 0; margin-bottom: 20px;
      transition: color var(--tr);
    }
    .back-link:hover { color: var(--accent); }

    .recover-desc { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 18px; }

    @media (max-width: 440px) {
      .login-header, .login-body, .login-footer { padding-left: 22px; padding-right: 22px; }
    }
  </style>
</head>
<body>

<div class="login-card">

  <div class="login-header">
    <div class="brand-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <div class="login-title">Mi Tienda</div>
    <div class="login-sub" id="header-sub">Accede a tu sistema de inventario</div>
  </div>

  <div class="login-body">

    <!-- ── PANEL LOGIN ── -->
    <div id="panel-login">
      <div class="msg-box" id="msg-login">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="msg-login-text"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-email">Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input class="form-input" id="login-email" type="email"
            placeholder="correo@ejemplo.com" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input class="form-input" id="login-password" type="password"
            placeholder="Tu contraseña" autocomplete="current-password">
          <button class="pass-toggle" id="toggle-pass" type="button" title="Mostrar/ocultar">
            <svg id="eye-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <a class="forgot-link" id="link-recover">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="btn-login" id="btn-login">
        <div class="spinner"></div>
        <span class="btn-text">Iniciar sesión</span>
      </button>
    </div>

    <!-- ── PANEL RECUPERAR ── -->
    <div id="panel-recover">
      <button class="back-link" id="btn-back-login">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Volver al inicio de sesión
      </button>

      <p class="recover-desc">
        Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <div class="msg-box" id="msg-recover">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="msg-recover-text"></span>
      </div>

      <div class="form-group">
        <label class="form-label" for="recover-email">Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input class="form-input" id="recover-email" type="email"
            placeholder="correo@ejemplo.com" autocomplete="email">
        </div>
      </div>

      <button class="btn-login" id="btn-recover">
        <div class="spinner"></div>
        <span class="btn-text">Enviar enlace de recuperación</span>
      </button>
    </div>

  </div>

  <div class="login-footer">Sistema de Inventario · Mi Tienda · v3.1</div>
</div>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ╔══════════════════════════════════════════════════╗
  // ║  REEMPLAZA CON TUS CREDENCIALES DE FIREBASE      ║
  // ║  Firebase Console → Tu proyecto → ⚙️ Config      ║
  // ║  → General → Tu app web → firebaseConfig         ║
  // ╚══════════════════════════════════════════════════╝
  const firebaseConfig = {
  apiKey: "AIzaSyDrF_RXo_USiffje-v4xCCtFtZSA4e__ls",
  authDomain: "inventario-23f27.firebaseapp.com",
  projectId: "inventario-23f27",
  storageBucket: "inventario-23f27.firebasestorage.app",
  messagingSenderId: "945719325554",
  appId: "1:945719325554:web:2f2d77d20ef309b8cea3eb",
  measurementId: "G-9FB3LMJCRR"
};

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Si ya hay sesión → ir al inventario directamente
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = "index.html";
  });

  const $ = id => document.getElementById(id);

  function setLoading(btn, on) { btn.classList.toggle('loading', on); btn.disabled = on; }

  function showMsg(boxId, textId, text, type = 'error') {
    const box = $(boxId), span = $(textId);
    if (!box || !span) return;
    span.textContent = text;
    box.className = `msg-box ${type}`;
  }

  function clearMsg(boxId) { const b = $(boxId); if (b) b.className = 'msg-box'; }

  function friendlyError(code) {
    return ({
      'auth/invalid-email':          'El correo electrónico no es válido.',
      'auth/user-not-found':         'No existe una cuenta con ese correo.',
      'auth/wrong-password':         'Contraseña incorrecta. Inténtalo de nuevo.',
      'auth/invalid-credential':     'Correo o contraseña incorrectos.',
      'auth/too-many-requests':      'Demasiados intentos. Espera un momento.',
      'auth/user-disabled':          'Esta cuenta ha sido deshabilitada.',
      'auth/network-request-failed': 'Error de red. Revisa tu conexión.',
    })[code] || 'Ocurrió un error. Inténtalo de nuevo.';
  }

  // Toggle ojo contraseña
  $('toggle-pass').addEventListener('click', () => {
    const inp = $('login-password'), isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    $('eye-icon').innerHTML = isText
      ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
      : `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`;
  });

  // Cambio de panel
  $('link-recover').addEventListener('click', e => {
    e.preventDefault();
    $('panel-login').style.display   = 'none';
    $('panel-recover').style.display = 'block';
    $('header-sub').textContent = 'Recuperar contraseña';
    clearMsg('msg-recover');
    $('recover-email').value = $('login-email').value || '';
    setTimeout(() => $('recover-email').focus(), 80);
  });

  $('btn-back-login').addEventListener('click', () => {
    $('panel-recover').style.display = 'none';
    $('panel-login').style.display   = 'block';
    $('header-sub').textContent = 'Accede a tu sistema de inventario';
    clearMsg('msg-login');
  });

  // INICIAR SESIÓN
  async function doLogin() {
    const email = $('login-email').value.trim(), password = $('login-password').value;
    clearMsg('msg-login');
    if (!email || !password) { showMsg('msg-login','msg-login-text','Completa todos los campos.'); return; }
    setLoading($('btn-login'), true);
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      showMsg('msg-login','msg-login-text', friendlyError(err.code));
      setLoading($('btn-login'), false);
    }
  }

  $('btn-login').addEventListener('click', doLogin);
  ['login-email','login-password'].forEach(id =>
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); })
  );

  // RECUPERAR CONTRASEÑA
  $('btn-recover').addEventListener('click', async () => {
    const email = $('recover-email').value.trim();
    clearMsg('msg-recover');
    if (!email) { showMsg('msg-recover','msg-recover-text','Ingresa tu correo electrónico.'); return; }
    setLoading($('btn-recover'), true);
    try {
      await sendPasswordResetEmail(auth, email);
      showMsg('msg-recover','msg-recover-text', `¡Listo! Revisa tu bandeja: ${email}`, 'success');
    } catch (err) {
      showMsg('msg-recover','msg-recover-text', friendlyError(err.code));
    } finally {
      setLoading($('btn-recover'), false);
    }
  });

  $('recover-email').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn-recover').click(); });
</script>
</body>
</html>
